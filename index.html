<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billiards Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .game-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .breaker-active {
            background-color: rgb(63 63 70) !important;
            border: 2px solid rgb(134 239 172);
            color: white;
        }
        .timer-display {
            font-family: monospace;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-lg mx-auto p-3">

        <!-- Header -->
        <div class="mb-3 flex items-center justify-between gap-3">
            <h1 class="text-2xl font-bold flex items-center gap-2 flex-shrink-0">
                <i class="fas fa-billiards text-emerald-500"></i>
                Billiards
            </h1>

            <div class="bg-zinc-900/70 rounded-3xl p-1 flex gap-1 flex-shrink-0 text-sm">
                <button id="session-tab-btn" onclick="showTab('session')" class="px-4 py-1.5 rounded-3xl bg-emerald-600 font-medium transition-all">
                    Session
                </button>
                <button id="history-tab-btn" onclick="showTab('history')" class="px-4 py-1.5 rounded-3xl bg-zinc-800 font-medium transition-all">
                    History
                </button>
            </div>
        </div>

        <div id="session-tab">

            <!-- Welcome Screen -->
            <div id="welcome-screen" class="bg-zinc-900 rounded-3xl p-6 text-center hidden">
                <i class="fas fa-billiards text-6xl text-emerald-500/20 mb-4"></i>
                <h2 class="text-xl font-bold mb-4">Ready to play a tournament?</h2>
                <p class="text-zinc-400 text-sm mb-6">Add 2+ players for round-robin</p>
                <div id="player-setup-list" class="space-y-3 mb-6"></div>
                <button onclick="addPlayerToSetup()" 
                        class="w-full py-3 border border-dashed border-zinc-400 hover:border-emerald-400 text-zinc-400 hover:text-emerald-400 rounded-3xl flex items-center justify-center gap-2 text-sm mb-6 transition-all">
                    <i class="fas fa-user-plus"></i> Add Player
                </button>
                <button onclick="startNewSession()" 
                        class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-base font-semibold rounded-3xl flex items-center justify-center gap-2 transition-all active:scale-95">
                    <i class="fas fa-play"></i> Start Round-Robin Tournament
                </button>
            </div>

            <!-- Current Session -->
            <div id="current-session" class="hidden bg-zinc-900 rounded-3xl p-4 shadow-2xl">
                <!-- Current Match controls (moved to top) -->
                <div class="bg-zinc-800/70 rounded-2xl p-4 mb-6">
                    <div class="flex justify-center items-center mb-4">
                        <h3 class="text-base font-semibold text-center w-full"><i class="fas fa-gamepad text-sm"></i> <span id="match-counter" class="font-mono">Game 1 - Set 1 (1/3)</span></h3>
                    </div>

                    <div id="current-match-players" class="bg-zinc-950 rounded-2xl p-4 mb-6 text-center border border-zinc-700">
                        <!-- Populated by JS -->
                    </div>

                    <div class="mb-4">
                        <p class="text-zinc-400 text-xs mb-2 text-center">Breaker</p>
                        <div id="breaker-display" class="py-4 bg-zinc-900 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3 text-emerald-400 border border-emerald-500/30">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <div>
                        <p class="text-zinc-400 text-xs mb-2 text-center">Who won this match?</p>
                        <div id="winner-buttons" class="grid grid-cols-2 gap-3"></div>
                    </div>
                    <button onclick="endSession()" 
                            class="w-full mt-4 py-2 text-red-400 hover:text-red-500 text-xs font-medium flex items-center justify-center gap-2 bg-red-950 hover:bg-red-900 rounded-xl transition-colors">
                        <i class="fas fa-stop text-xs"></i> END SESSION
                    </button>
                </div>

                <!-- Dynamic Player Scores -->
                <div id="player-scores" class="mb-6 flex flex-wrap justify-center gap-4"></div>

                <div id="game-results" class="mb-5 flex gap-1.5 flex-wrap bg-zinc-800/50 rounded-xl p-2 min-h-10 items-center"></div>

                <div class="mt-4">
                    <div onclick="toggleGamesList()" class="flex items-center justify-between cursor-pointer mb-2">
                        <h3 class="text-sm font-medium flex items-center gap-2">
                            <i class="fas fa-list text-xs"></i> Games Played
                        </h3>
                        <i id="games-list-chevron" class="fas fa-chevron-down text-zinc-400 transition-transform"></i>
                    </div>
                    <div id="games-list" class="space-y-2 max-h-[180px] overflow-y-auto pr-1 hidden"></div>
                </div>
            </div>
        </div>

        <div id="history-tab" class="hidden bg-zinc-900 rounded-3xl p-4 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold">Session History</h2>
                    <p class="text-zinc-500 text-xs">Review completed past sessions.</p>
                </div>
                <button onclick="showTab('session')" class="text-zinc-400 bg-zinc-800 px-2 py-1 rounded-lg hover:bg-zinc-700 text-sm">Back</button>
            </div>
            <div id="history-list" class="space-y-2 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Summary Modal -->
    <div id="summary-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-md mx-4 p-5 relative">
            <button onclick="hideSummary()" aria-label="Close summary" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-lg">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="text-2xl font-bold text-center mb-5">Session Summary</h2>
            <div id="summary-content" class="space-y-5"></div>
            <div class="flex gap-2 mt-6">
                <button id="resume-summary-btn" onclick="hideSummary()" class="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl font-medium text-sm">Resume</button>
                <button id="end-session-btn" onclick="confirmCloseSession()" class="flex-1 py-2 bg-red-600 hover:bg-red-500 rounded-xl font-medium text-sm">End Session</button>
                <button id="share-summary-btn" onclick="shareSession()" class="hidden flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium flex items-center justify-center gap-1 text-sm">
                    <i class="fas fa-share-alt text-sm"></i> Share
                </button>
                <button id="close-summary-btn" onclick="hideSummary()" class="hidden flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl font-medium text-sm">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let summarySession = null; // session shown in summary modal (may differ from active session)
        let sessionsHistory = [];
        let currentBreaker = 1;
        let gameStartTime = null;
        let timerInterval = null;
        let setupPlayers = [];
        const PLAYER_COLORS = ['emerald', 'amber', 'sky', 'violet', 'rose', 'lime', 'cyan', 'fuchsia'];
        const COLOR_TEXT = {
            emerald: 'text-emerald-400', amber: 'text-amber-400', sky: 'text-sky-400', violet: 'text-violet-400',
            rose: 'text-rose-400', lime: 'text-lime-400', cyan: 'text-cyan-400', fuchsia: 'text-fuchsia-400'
        };
        const COLOR_BG = {
            emerald: 'bg-emerald-600', amber: 'bg-amber-600', sky: 'bg-sky-600', violet: 'bg-violet-600',
            rose: 'bg-rose-600', lime: 'bg-lime-600', cyan: 'bg-cyan-600', fuchsia: 'bg-fuchsia-600'
        };
        const COLOR_BG_SOFT = {
            emerald: 'bg-emerald-500/20', amber: 'bg-amber-500/20', sky: 'bg-sky-500/20', violet: 'bg-violet-500/20',
            rose: 'bg-rose-500/20', lime: 'bg-lime-500/20', cyan: 'bg-cyan-500/20', fuchsia: 'bg-fuchsia-500/20'
        };
        const COLOR_BORDER = {
            emerald: 'border-emerald-500/30', amber: 'border-amber-500/30', sky: 'border-sky-500/30', violet: 'border-violet-500/30',
            rose: 'border-rose-500/30', lime: 'border-lime-500/30', cyan: 'border-cyan-500/30', fuchsia: 'border-fuchsia-500/30'
        };
        const COLOR_BORDER_HOVER = {
            emerald: 'hover:border-emerald-400', amber: 'hover:border-amber-400', sky: 'hover:border-sky-400', violet: 'hover:border-violet-400',
            rose: 'hover:border-rose-400', lime: 'hover:border-lime-400', cyan: 'hover:border-cyan-400', fuchsia: 'hover:border-fuchsia-400'
        };
        const COLOR_TEXT_SOFT = {
            emerald: 'text-emerald-100', amber: 'text-amber-100', sky: 'text-sky-100', violet: 'text-violet-100',
            rose: 'text-rose-100', lime: 'text-lime-100', cyan: 'text-cyan-100', fuchsia: 'text-fuchsia-100'
        };

        function $(id) {
            return document.getElementById(id);
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function clearTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            gameStartTime = null;
        }

        function showWelcomeScreen() {
            $('current-session')?.classList.add('hidden');
            $('welcome-screen')?.classList.remove('hidden');
            initializePlayerSetup();
        }

        function teardownToWelcome() {
            clearTimer();
            currentSession = null;
            summarySession = null;
            showWelcomeScreen();
        }

        function loadData() {
            const saved = localStorage.getItem('billiardsSessions');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    sessionsHistory = Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    console.warn('Failed to parse billiardsSessions; resetting history.', e);
                    sessionsHistory = [];
                    try { localStorage.removeItem('billiardsSessions'); } catch (_) { /* ignore */ }
                }
            }

            const unfinished = sessionsHistory.find(s => s && !s.completed);
            if (unfinished) {
                currentSession = unfinished;
                showCurrentSession();
            } else {
                showWelcomeScreen();
            }
        }

        function saveData() {
            if (!currentSession) return;
            const index = sessionsHistory.findIndex(s => s.id === currentSession.id);
            if (index >= 0) sessionsHistory[index] = currentSession;
            else sessionsHistory.push(currentSession);
            try {
                localStorage.setItem('billiardsSessions', JSON.stringify(sessionsHistory));
            } catch (e) {
                console.warn('Failed to save sessions', e);
            }
        }

        function startTimer() {
            // Only run when the live timer node exists (created in renderCurrentMatch)
            if (!$('live-timer')) return;
            if (timerInterval) clearInterval(timerInterval);
            gameStartTime = Date.now();
            timerInterval = setInterval(updateLiveTimer, 1000);
            updateLiveTimer();
        }

        function updateLiveTimer() {
            if (!gameStartTime) return;
            const timerEl = $('live-timer');
            if (!timerEl) return;
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const m = Math.floor(elapsed / 60);
            const s = elapsed % 60;
            timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getElapsedSeconds() {
            if (!gameStartTime) return 0;
            return Math.floor((Date.now() - gameStartTime) / 1000);
        }

        function stopAndSaveDuration() {
            const duration = getElapsedSeconds();
            clearTimer();
            return duration;
        }

        function resumeTimer() {
            // Keep counting from the original gameStartTime (do not reset elapsed)
            if (!gameStartTime || !$('live-timer')) return;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateLiveTimer, 1000);
            updateLiveTimer();
        }

        // Setup functions for multiple players
        function initializePlayerSetup() {
            setupPlayers = ['Drey', 'Etienne'];
            renderPlayerSetup();
        }

        function renderPlayerSetup() {
            const container = $('player-setup-list');
            if (!container) return;
            container.innerHTML = '';
            setupPlayers.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 bg-zinc-800 rounded-2xl p-1';

                const input = document.createElement('input');
                input.value = name;
                input.className = 'flex-1 bg-transparent text-base font-semibold px-4 py-3 focus:outline-none text-center';
                input.placeholder = 'Player name';
                input.onchange = () => updatePlayerName(index, input.value);
                div.appendChild(input);

                if (setupPlayers.length > 2) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'px-3 text-red-400 hover:text-red-500';
                    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    removeBtn.onclick = (e) => {
                        e.stopImmediatePropagation();
                        removePlayerFromSetup(index);
                    };
                    div.appendChild(removeBtn);
                }

                container.appendChild(div);
            });
        }

        function updatePlayerName(index, value) {
            setupPlayers[index] = (value || `Player ${index + 1}`).trim();
        }

        function addPlayerToSetup() {
            if (setupPlayers.length >= 8) {
                alert("Maximum 8 players supported");
                return;
            }
            setupPlayers.push(`Player ${setupPlayers.length + 1}`);
            renderPlayerSetup();
        }

        function removePlayerFromSetup(index) {
            if (setupPlayers.length <= 2) return;
            setupPlayers.splice(index, 1);
            renderPlayerSetup();
        }

        function generateMatches(players) {
            const matches = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    // Dictate breaker fairly using index parity
                    const breaker = (i + j) % 2 === 0 ? players[i] : players[j];
                    matches.push({
                        matchNum: matches.length + 1,
                        player1: players[i],
                        player2: players[j],
                        breaker: breaker,
                        winner: null,
                        duration: 0,
                        completed: false
                    });
                }
            }
            return matches;
        }

        function startNewSession() {
            const validPlayers = setupPlayers.filter(p => p && p.trim() !== '').map(p => p.trim());
            if (validPlayers.length < 2) {
                alert("At least 2 players required!");
                return;
            }
            const uniquePlayers = [...new Set(validPlayers)];

            // Randomize player order before generating the round-robin sequence
            const shuffledPlayers = [...uniquePlayers].sort(() => Math.random() - 0.5);

            clearTimer();
            summarySession = null;

            currentSession = {
                id: 'sess_' + Date.now(),
                date: new Date().toISOString().split('T')[0],
                startTime: Date.now(),
                players: shuffledPlayers,
                schedule: generateMatches(shuffledPlayers), // randomized repeating sequence
                playedGames: [],
                currentMatchIndex: 0,
                games: [],
                completed: false,
                totalDuration: 0
            };
            sessionsHistory.push(currentSession);

            saveData();
            showCurrentSession();
        }

        function showCurrentSession() {
            $('welcome-screen')?.classList.add('hidden');
            $('current-session')?.classList.remove('hidden');
            showTab('session');
            renderCurrentSession();
        }

        function getPlayerColor(playerName, session = currentSession) {
            if (!session || !session.players) return 'emerald';
            const index = session.players.indexOf(playerName);
            if (index < 0) return 'emerald';
            return PLAYER_COLORS[index % PLAYER_COLORS.length];
        }

        function getPlayerWins(playerName, session = currentSession) {
            if (!session) return 0;
            const games = session.playedGames || session.matches || session.games || [];
            return games.filter(g => (g.winner === playerName || g.winnerName === playerName)).length;
        }

        function getEffectiveBreaker(matchTemplate) {
            if (!matchTemplate) return null;
            if (!currentSession) return matchTemplate.breaker;
            const played = currentSession.playedGames || [];
            // Find prior meetings of this exact pair (order insensitive)
            const prior = played.filter(g =>
                (g.player1 === matchTemplate.player1 && g.player2 === matchTemplate.player2) ||
                (g.player1 === matchTemplate.player2 && g.player2 === matchTemplate.player1)
            );
            const count = prior.length; // 0 = first time, use original; 1 = second time, flip, etc.
            if (count % 2 === 0) {
                return matchTemplate.breaker;
            }
            // Flip to the other player in the pair
            return matchTemplate.breaker === matchTemplate.player1 ? matchTemplate.player2 : matchTemplate.player1;
        }

        function renderCurrentSession() {
            if (!currentSession) return;
            if (!currentSession.players || !currentSession.schedule) {
                // Backward compat for old 2-player sessions
                if (currentSession.player1 && currentSession.player2) {
                    const legacyGames = Array.isArray(currentSession.games) ? currentSession.games : [];
                    currentSession.players = [currentSession.player1, currentSession.player2];
                    currentSession.schedule = legacyGames.length > 0
                        ? legacyGames.map(g => ({
                            matchNum: g.gameNum || g.matchNum,
                            player1: currentSession.player1,
                            player2: currentSession.player2,
                            breaker: g.breaker === 1 ? currentSession.player1 : currentSession.player2,
                            winner: null,
                            duration: 0,
                            completed: false
                        }))
                        : generateMatches(currentSession.players);
                    currentSession.playedGames = legacyGames.map(g => ({
                        ...g,
                        winner: g.winnerName || (g.winner === 1 ? currentSession.player1 : currentSession.player2)
                    }));
                    currentSession.currentMatchIndex = currentSession.playedGames.length;
                } else {
                    return;
                }
            }

            renderPlayerScores();
            renderGameResults();
            const matchReady = renderCurrentMatch();
            renderGamesList();

            // Only start the timer for a brand-new game after match UI (incl. #live-timer) exists
            if (matchReady && !gameStartTime) startTimer();
            else if (matchReady && gameStartTime) updateLiveTimer();

            const schedule = currentSession.schedule || [];
            const currentIdx = currentSession.currentMatchIndex || 0;
            const cycleLength = schedule.length || 1;
            const positionInCycle = currentIdx % cycleLength;

            // Game = current overall game count
            const totalGames = (currentSession.playedGames ? currentSession.playedGames.length : currentIdx) + 1;

            // Set = which full round of all players vs each other is currently being played
            const currentSet = Math.floor(currentIdx / cycleLength) + 1;

            // Set Game = which specific matchup within the current Set
            const setGame = positionInCycle + 1;

            const matchCounter = $('match-counter');
            if (matchCounter) {
                matchCounter.textContent =
                    `Game ${totalGames} - Set ${currentSet} (${setGame}/${cycleLength})`;
            }
        }

        function renderPlayerScores() {
            const container = $('player-scores');
            if (!container || !currentSession?.players) return;
            container.innerHTML = '';
            currentSession.players.forEach(player => {
                const wins = getPlayerWins(player);
                const color = getPlayerColor(player);
                const div = document.createElement('div');
                div.className = `bg-zinc-800 rounded-2xl p-4 text-center flex-1 min-w-[110px] border border-transparent transition-all ${COLOR_BORDER_HOVER[color] || ''}`;
                div.innerHTML = `
                    <div class="text-5xl font-bold ${COLOR_TEXT[color] || 'text-emerald-400'} mb-1">${wins}</div>
                    <div class="text-[10px] uppercase tracking-widest text-zinc-500">${escapeHtml(player)}</div>
                `;
                container.appendChild(div);
            });
        }

        function renderGameResults() {
            const container = $('game-results');
            if (!container || !currentSession) return;
            container.innerHTML = '';
            const completed = currentSession.playedGames || currentSession.matches?.filter(m => m.completed && m.winner) || currentSession.games || [];
            if (completed.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-xs w-full text-center py-4">No matches played yet. Complete current match to see results.</p>';
                return;
            }
            completed.forEach((match, idx) => {
                const winnerName = match.winner || match.winnerName || (typeof match.winner === 'number' ? (match.winner === 1 ? (currentSession.players?.[0] || currentSession.player1) : (currentSession.players?.[1] || currentSession.player2)) : '');
                const color = getPlayerColor(winnerName);
                const initial = winnerName ? winnerName.substring(0, 1).toUpperCase() : '?';
                const box = document.createElement('div');
                box.className = `w-9 h-9 rounded-2xl ${COLOR_BG[color] || 'bg-emerald-600'} flex items-center justify-center text-xs font-bold text-white shadow-md flex-shrink-0 cursor-pointer active:scale-95 transition-transform`;
                box.textContent = initial;
                box.title = `Click to edit: ${winnerName} won match ${match.matchNum || idx+1}`;
                box.onclick = () => editMatchResult(idx);
                container.appendChild(box);
            });
        }

        function editMatchResult(index) {
            if (!currentSession || !currentSession.playedGames) return;
            const match = currentSession.playedGames[index];
            if (!match) return;

            const p1 = match.player1;
            const p2 = match.player2;
            const container = $('game-results');
            if (!container) return;

            const color1 = getPlayerColor(p1);
            const color2 = getPlayerColor(p2);
            const isP1Winner = match.winner === p1;
            const isP2Winner = match.winner === p2;

            const mins = Math.floor((match.duration || 0) / 60);
            const secs = (match.duration || 0) % 60;
            const durationStr = `${mins}:${secs.toString().padStart(2, '0')}`;
            const gameLabel = match.matchNum || (index + 1);
            const breakerLabel = match.breaker || '—';

            container.innerHTML = '';
            const wrap = document.createElement('div');
            wrap.className = 'w-full';

            const meta = document.createElement('div');
            meta.className = 'text-center mb-3 text-xs text-zinc-400 font-mono';
            meta.textContent = `Game ${gameLabel} • ${breakerLabel} broke • ${durationStr}`;
            wrap.appendChild(meta);

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 gap-2';

            const makeWinnerBtn = (playerName, color, isWinner) => {
                const btn = document.createElement('button');
                btn.className = `py-3 rounded-2xl ${COLOR_BG[color] || 'bg-emerald-600'} text-white font-semibold ${isWinner ? 'ring-4 ring-offset-2 ring-offset-zinc-900 ring-white' : ''}`;
                btn.textContent = `${playerName}${isWinner ? ' ✓' : ''}`;
                btn.onclick = () => changeMatchWinner(index, playerName);
                return btn;
            };

            grid.appendChild(makeWinnerBtn(p1, color1, isP1Winner));
            grid.appendChild(makeWinnerBtn(p2, color2, isP2Winner));

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'py-3 text-xs bg-red-900 hover:bg-red-800 text-red-200 rounded-2xl';
            deleteBtn.textContent = 'Delete Game';
            deleteBtn.onclick = () => confirmDeleteMatchResult(index);
            grid.appendChild(deleteBtn);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'py-3 text-xs bg-zinc-700 hover:bg-zinc-600 text-zinc-300 rounded-2xl';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => cancelEditMatchResult();
            grid.appendChild(cancelBtn);

            wrap.appendChild(grid);
            container.appendChild(wrap);
        }

        function changeMatchWinner(index, newWinner) {
            if (!currentSession?.playedGames) return;
            const match = currentSession.playedGames[index];
            if (!match) return;

            match.winner = newWinner;

            // Also update the corresponding games entry for compatibility
            if (currentSession.games && currentSession.games[index]) {
                currentSession.games[index].winner = newWinner;
                currentSession.games[index].winnerName = newWinner;
            }

            saveData();
            renderCurrentSession();
        }

        function confirmDeleteMatchResult(index) {
            if (!confirm('Delete this game result?')) return;
            deleteMatchResult(index);
        }

        function deleteMatchResult(index) {
            if (!currentSession || !currentSession.playedGames || index < 0 || index >= currentSession.playedGames.length) return;

            // Remove the match and reclaim its duration
            const removedPlayed = currentSession.playedGames.splice(index, 1)[0];
            if (removedPlayed && typeof removedPlayed.duration === 'number') {
                currentSession.totalDuration = Math.max(0, (currentSession.totalDuration || 0) - removedPlayed.duration);
            }
            if (currentSession.games && currentSession.games.length > index) {
                currentSession.games.splice(index, 1);
            }

            // Roll the match index back so the deleted game becomes the current one again
            currentSession.currentMatchIndex = Math.max(0, (currentSession.currentMatchIndex || 0) - 1);

            saveData();
            renderCurrentSession();
        }

        function cancelEditMatchResult() {
            // Always do a clean re-render so every bubble gets fresh onclick handlers.
            renderCurrentSession();
        }

        function toggleGamesList() {
            const list = $('games-list');
            const chevron = $('games-list-chevron');
            if (!list || !chevron) return;

            if (list.classList.contains('hidden')) {
                list.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                list.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function renderCurrentMatch() {
            if (!currentSession) return false;
            const schedule = currentSession.schedule || currentSession.matches || [];
            if (!schedule.length) return false;
            const index = (currentSession.currentMatchIndex || 0) % schedule.length;
            const matchTemplate = schedule[index];
            if (!matchTemplate) return false;

            // Current match players display (from schedule template)
            const p1Color = getPlayerColor(matchTemplate.player1);
            const p2Color = getPlayerColor(matchTemplate.player2);
            const matchDiv = $('current-match-players');
            if (!matchDiv) return false;

            // Preserve elapsed timer text across re-renders of this block
            const previousTimerText = $('live-timer')?.textContent || '';

            matchDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-1 text-xl w-full">
                    <div class="flex items-center justify-center gap-6 w-full">
                        <div class="flex-1 flex justify-end text-right pr-2">
                            <div class="text-3xl font-bold ${COLOR_TEXT[p1Color] || 'text-emerald-400'}">${escapeHtml(matchTemplate.player1)}</div>
                        </div>
                        <div class="text-center">
                            <div class="text-4xl font-black text-zinc-600">VS</div>
                        </div>
                        <div class="flex-1 flex justify-start text-left pl-2">
                            <div class="text-3xl font-bold ${COLOR_TEXT[p2Color] || 'text-emerald-400'}">${escapeHtml(matchTemplate.player2)}</div>
                        </div>
                    </div>
                    <div id="live-timer" class="timer-display text-zinc-600 text-4xl font-black text-center min-h-[2.5rem]"></div>
                </div>
            `;

            if (previousTimerText && $('live-timer')) {
                $('live-timer').textContent = previousTimerText;
            }

            // Breaker (dictated from template, alternates on rematches)
            const effectiveBreaker = getEffectiveBreaker(matchTemplate);
            const breakerColor = getPlayerColor(effectiveBreaker);
            const breakerDiv = $('breaker-display');
            if (breakerDiv) {
                breakerDiv.className = `py-4 bg-zinc-900 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3 ${COLOR_TEXT[breakerColor] || 'text-emerald-400'} border ${COLOR_BORDER[breakerColor] || 'border-emerald-500/30'} cursor-pointer hover:bg-zinc-800 active:scale-[0.98] transition-all`;
                breakerDiv.title = 'Click to change breaker';
                breakerDiv.innerHTML = `
                    <i class="fas fa-gavel"></i>
                    <span>${escapeHtml(effectiveBreaker || '')} breaks</span>
                `;
                breakerDiv.onclick = () => {
                    // Flip breaker for the current match template
                    const other = matchTemplate.breaker === matchTemplate.player1 ? matchTemplate.player2 : matchTemplate.player1;
                    matchTemplate.breaker = other;
                    renderCurrentMatch(); // refresh breaker display only
                    if (gameStartTime) updateLiveTimer();
                };
            }

            renderWinnerButtons(matchTemplate);
            return true;
        }

        function renderWinnerButtons(match) {
            const container = $('winner-buttons');
            if (!container || !match) return;
            container.innerHTML = '';
            const p1 = match.player1;
            const p2 = match.player2;
            [p1, p2].forEach(playerName => {
                const color = getPlayerColor(playerName);
                const btn = document.createElement('button');
                btn.className = `group py-6 rounded-3xl font-bold text-lg flex flex-col items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 border-2 border-zinc-700 ${COLOR_BORDER_HOVER[color] || 'hover:border-emerald-400'} transition-all active:scale-[0.98]`;
                btn.innerHTML = `
                    <i class="fas fa-trophy text-2xl ${COLOR_TEXT[color] || 'text-emerald-400'} group-active:scale-110 transition-transform"></i>
                    <span class="${COLOR_TEXT_SOFT[color] || 'text-emerald-100'}">${escapeHtml(playerName)}</span>
                `;
                btn.onclick = () => declareMatchWinner(playerName);
                container.appendChild(btn);
            });
        }

        function showTab(tab) {
            const sessionTab = $('session-tab');
            const historyTab = $('history-tab');
            const sessionBtn = $('session-tab-btn');
            const historyBtn = $('history-tab-btn');
            if (!sessionTab || !historyTab || !sessionBtn || !historyBtn) return;
            const isSession = tab === 'session';

            sessionTab.classList.toggle('hidden', !isSession);
            historyTab.classList.toggle('hidden', isSession);
            sessionBtn.classList.toggle('bg-emerald-600', isSession);
            sessionBtn.classList.toggle('bg-zinc-800', !isSession);
            historyBtn.classList.toggle('bg-emerald-600', !isSession);
            historyBtn.classList.toggle('bg-zinc-800', isSession);

            if (!isSession) {
                populateHistory();
            }
        }

        function populateHistory() {
            const container = $('history-list');
            if (!container) return;
            container.innerHTML = '';

            const completed = sessionsHistory.filter(s => s && s.completed).reverse();

            if (completed.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-zinc-500">No completed sessions yet.<br><br>Complete a round-robin tournament to see history here.</div>`;
                return;
            }

            completed.forEach(s => {
                const players = s.players || [s.player1, s.player2].filter(Boolean);
                const played = s.playedGames || s.matches || s.games || [];
                const winCounts = {};
                players.forEach(p => {
                    winCounts[p] = played.filter(m => (m.winner === p || m.winnerName === p)).length;
                });
                // Sort players by wins desc (most wins first)
                const sortedPlayers = [...players].sort((a, b) => winCounts[b] - winCounts[a] || a.localeCompare(b));
                const playerDisplay = sortedPlayers.map(p => `${escapeHtml(p)} (${winCounts[p]})`).join(' • ');

                const numMatches = played.length || (s.matches ? s.matches.length : (s.games ? s.games.length : 0));
                const totalMin = Math.floor((s.totalDuration || 0) / 60);
                const totalSec = (s.totalDuration || 0) % 60;
                const avg = numMatches ? Math.floor((s.totalDuration || 0) / numMatches) : 0;
                const avgMin = Math.floor(avg / 60);
                const avgS = avg % 60;

                const sessionDate = new Date(s.startTime || Date.now());
                const dateStr = sessionDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                const timeStr = sessionDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const div = document.createElement('div');
                div.className = "bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 cursor-pointer transition-colors";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-xs text-zinc-400">${dateStr} • ${timeStr}</div>
                            <div class="font-semibold text-sm mt-1">${playerDisplay}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-bold text-white">${numMatches}</div>
                            <div class="text-[10px] text-emerald-400 -mt-1">games played</div>
                        </div>
                    </div>
                    <div class="flex justify-between text-[10px] mt-4 border-t border-zinc-700 pt-3">
                        <div>
                            <span class="text-emerald-400">Session ${totalMin}:${totalSec.toString().padStart(2,'0')}</span>
                            <span class="text-zinc-500 mx-1">|</span>
                            <span class="text-emerald-400">Game Avg ${avgMin}:${avgS.toString().padStart(2,'0')}</span>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" data-action="share" class="text-blue-400 hover:text-blue-300">
                                <i class="fas fa-share-alt"></i>
                            </button>
                            <button type="button" data-action="delete" class="text-red-400 hover:text-red-500">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                div.querySelector('[data-action="share"]')?.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    shareSessionById(s.id);
                });
                div.querySelector('[data-action="delete"]')?.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    deleteSession(s.id);
                });
                div.onclick = () => {
                    // View history summary without clobbering an active unfinished session
                    showSummary(s);
                };
                container.appendChild(div);
            });
        }

        function renderGamesList() {
            const container = $('games-list');
            if (!container || !currentSession) return;
            container.innerHTML = '';
            const allMatches = currentSession.playedGames || currentSession.matches || currentSession.games || [];
            if (allMatches.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-zinc-500 text-xs">No matches played yet</div>`;
                return;
            }
            allMatches.forEach((match, i) => {
                if (!match.winner && !match.winnerName && !match.completed) return; // only completed
                const mins = Math.floor((match.duration || 0) / 60);
                const secs = (match.duration || 0) % 60;
                const winnerName = match.winner || match.winnerName || (typeof match.winner === 'number' ? (match.winner === 1 ? (currentSession.players ? currentSession.players[0] : currentSession.player1) : (currentSession.players ? currentSession.players[1] : currentSession.player2)) : '');
                const breakerName = match.breaker || (typeof match.breaker === 'number' ? (match.breaker === 1 ? (currentSession.players ? currentSession.players[0] : currentSession.player1) : (currentSession.players ? currentSession.players[1] : currentSession.player2)) : match.breaker);
                const div = document.createElement('div');
                div.className = `game-card bg-zinc-800 rounded-xl p-3 flex items-center justify-between text-sm`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-zinc-700 rounded-lg flex items-center justify-center font-mono text-[10px]">${match.matchNum || i+1}</div>
                        <div class="text-xs">
                            <div class="text-zinc-400">${escapeHtml(breakerName)} broke</div>
                            <div class="font-medium">${escapeHtml(winnerName)} won</div>
                            <div class="text-[10px] text-zinc-500">${escapeHtml(match.player1 || '')} vs ${escapeHtml(match.player2 || '')}</div>
                        </div>
                    </div>
                    <div class="text-right text-emerald-400 text-xs font-mono">
                        ${mins}:${secs.toString().padStart(2, '0')}
                        <i class="fas fa-check-circle block text-emerald-400 text-xs mt-1"></i>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function declareMatchWinner(winnerName) {
            if (!currentSession) return;
            const schedule = currentSession.schedule || currentSession.matches || [];
            if (!schedule.length) return;
            const index = (currentSession.currentMatchIndex || 0) % schedule.length;
            const matchTemplate = schedule[index];
            if (!matchTemplate) return;

            // Peek elapsed time without stopping — cancel must keep the same timer running
            const previewDuration = getElapsedSeconds();

            // Guard against accidental double-clicks: confirm very short games
            if (previewDuration < 30) {
                if (!confirm(`This match only took ${previewDuration} second(s). Are you sure you want to record this result?`)) {
                    // User cancelled — leave gameStartTime as-is so elapsed continues
                    resumeTimer();
                    return;
                }
            }

            // Confirmed (or long enough): stop timer and record this game's duration
            const duration = stopAndSaveDuration();

            // Record completed instance with effective (alternating) breaker
            const effectiveBreaker = getEffectiveBreaker(matchTemplate);
            const result = {
                matchNum: matchTemplate.matchNum,
                player1: matchTemplate.player1,
                player2: matchTemplate.player2,
                breaker: effectiveBreaker,
                winner: winnerName,
                duration: duration,
                round: Math.floor((currentSession.currentMatchIndex || 0) / schedule.length) + 1
            };
            currentSession.playedGames = currentSession.playedGames || [];
            currentSession.playedGames.push(result);
            currentSession.games = currentSession.games || [];
            currentSession.games.push(result);
            currentSession.currentMatchIndex = (currentSession.currentMatchIndex || 0) + 1;
            // Accumulate total duration
            currentSession.totalDuration = (currentSession.totalDuration || 0) + duration;
            saveData();
            renderCurrentSession();

            // Start a fresh timer only for the next game
            clearTimer();
            startTimer();
        }

        function sessionHasMatches(session) {
            if (!session) return false;
            if (session.playedGames && session.playedGames.length > 0) return true;
            if (session.games && session.games.length > 0) return true;
            if (session.matches && session.matches.some(m => m.completed || m.winner || m.winnerName)) return true;
            return false;
        }

        function endSession() {
            if (!currentSession) return;
            if (!sessionHasMatches(currentSession)) {
                if (confirm("Delete empty session?")) {
                    sessionsHistory = sessionsHistory.filter(s => s.id !== currentSession?.id);
                    try {
                        localStorage.setItem('billiardsSessions', JSON.stringify(sessionsHistory));
                    } catch (e) {
                        console.warn('Failed to save sessions', e);
                    }
                    teardownToWelcome();
                }
                return;
            }
            showSummary(currentSession);
        }

        function showSummary(session = currentSession) {
            if (!session) return;
            summarySession = session;

            const modal = $('summary-modal');
            const content = $('summary-content');
            if (!modal || !content) return;

            const scheduleLen = (session.schedule || session.matches || []).length || 1;
            const playedList = session.playedGames || session.games || (session.matches ? session.matches.filter(m => m.completed) : []) || [];
            const played = playedList.length;
            const totalDuration = typeof session.totalDuration === 'number'
                ? session.totalDuration
                : Math.floor((Date.now() - (session.startTime || Date.now())) / 1000);
            const avg = played ? Math.floor(totalDuration / played) : 0;
            const fullRounds = scheduleLen > 0 ? Math.floor(played / scheduleLen) : 0;
            const remainder = scheduleLen > 0 ? played % scheduleLen : 0;

            let standingsHTML = '<div class="space-y-3">';
            if (session.players) {
                session.players.forEach((player) => {
                    const wins = getPlayerWins(player, session);
                    const color = getPlayerColor(player, session);
                    const initial = (player && player[0]) ? player[0].toUpperCase() : '?';
                    standingsHTML += `
                        <div class="flex justify-between items-center bg-zinc-800 rounded-2xl px-4 py-3">
                            <div class="flex items-center gap-3">
                                <div class="w-6 h-6 rounded-full ${COLOR_BG_SOFT[color] || 'bg-emerald-500/20'} flex items-center justify-center ${COLOR_TEXT[color] || 'text-emerald-400'} text-xs font-bold">${escapeHtml(initial)}</div>
                                <span class="font-medium">${escapeHtml(player)}</span>
                            </div>
                            <div class="text-3xl font-bold ${COLOR_TEXT[color] || 'text-emerald-400'}">${wins}</div>
                        </div>
                    `;
                });
            } else {
                // old 2 player fallback
                let s1 = 0, s2 = 0;
                (session.games || []).forEach(g => {
                    if (g.winner === 1 || g.winnerName === session.player1) s1++;
                    else s2++;
                });
                standingsHTML += `
                    <div class="text-5xl font-bold">${s1} - ${s2}</div>
                    <div>${escapeHtml(session.player1 || '')} vs ${escapeHtml(session.player2 || '')}</div>
                `;
            }
            standingsHTML += '</div>';

            const playersLabel = session.players
                ? session.players.map(escapeHtml).join(' • ')
                : `${escapeHtml(session.player1 || '')} • ${escapeHtml(session.player2 || '')}`;

            const matchLog = (session.playedGames && session.playedGames.length > 0)
                ? `<div class="mt-6 text-xs text-zinc-400 bg-zinc-950 p-3 rounded-xl font-mono leading-relaxed max-h-40 overflow-y-auto">
                    ${session.playedGames.map((m) => {
                        const p1Tags = `${m.breaker === m.player1 ? '(B)' : ''}${m.winner === m.player1 ? '(W)' : ''}`;
                        const p2Tags = `${m.breaker === m.player2 ? '(B)' : ''}${m.winner === m.player2 ? '(W)' : ''}`;
                        return `${escapeHtml(m.matchNum)} (r${escapeHtml(m.round || 1)}): ${escapeHtml(m.player1)} ${p1Tags} vs ${escapeHtml(m.player2)} ${p2Tags}`;
                    }).join('<br>')}
                </div>`
                : '';

            content.innerHTML = `
                <div class="text-center mb-6">
                    <div class="text-4xl font-bold text-emerald-400">Tournament Summary</div>
                    <div class="text-zinc-400 mt-1">${playersLabel} • ${fullRounds} full round(s) + ${remainder} matches</div>
                </div>
                <div class="mb-6">
                    ${standingsHTML}
                </div>
                <div class="grid grid-cols-3 gap-3 text-center bg-zinc-800/70 rounded-2xl p-4">
                    <div>
                        <div class="text-3xl font-bold">${played}</div>
                        <div class="text-xs text-zinc-400">MATCHES PLAYED</div>
                    </div>
                    <div>
                        <div class="text-3xl font-bold text-emerald-400">${Math.floor(totalDuration/60)}:${(totalDuration % 60).toString().padStart(2, '0')}</div>
                        <div class="text-xs text-zinc-400">TOTAL TIME</div>
                    </div>
                    <div>
                        <div class="text-3xl font-bold">${Math.floor(avg/60)}:${(avg % 60).toString().padStart(2, '0')}</div>
                        <div class="text-xs text-zinc-400">AVG/MATCH</div>
                    </div>
                </div>
                ${matchLog}
            `;

            // Completed history view, or active session already marked completed
            const isCompleted = !!session.completed;
            const viewingHistoryWhileActive = isCompleted && currentSession && currentSession.id !== session.id && !currentSession.completed;

            $('resume-summary-btn')?.classList.toggle('hidden', isCompleted);
            $('end-session-btn')?.classList.toggle('hidden', isCompleted);
            $('share-summary-btn')?.classList.toggle('hidden', !isCompleted);
            $('close-summary-btn')?.classList.toggle('hidden', !isCompleted);

            // "closed" means closing should leave summary without ending an active unfinished session
            modal.dataset.closed = isCompleted ? 'true' : 'false';
            modal.dataset.historyOnly = viewingHistoryWhileActive ? 'true' : 'false';
            modal.classList.remove('hidden');
        }

        function generateShareText(session) {
            if (!session) return '';
            const players = session.players || [session.player1 || 'P1', session.player2 || 'P2'].filter(Boolean);
            const played = session.playedGames || session.games || [];
            const scheduleLen = (session.schedule || session.matches || []).length || 1;

            // Correct win counts from playedGames (supports looping sessions)
            let winsText = '';
            players.forEach(p => {
                const w = played.filter(g => (g.winner === p || g.winnerName === p)).length;
                winsText += `${p}: ${w} wins\n`;
            });

            const numMatches = played.length;
            const duration = typeof session.totalDuration === 'number'
                ? session.totalDuration
                : Math.floor((Date.now() - (session.startTime || Date.now())) / 1000);
            const totalMin = Math.floor(duration / 60);
            const totalSec = duration % 60;
            const avg = numMatches ? Math.floor(duration / numMatches) : 0;
            const avgMin = Math.floor(avg / 60);
            const avgS = avg % 60;
            const fullRounds = scheduleLen > 0 ? Math.floor(numMatches / scheduleLen) : 0;

            let matchDetails = '';
            played.forEach((m, index) => {
                const p1Tags = `${m.breaker === m.player1 ? '(B)' : ''}${m.winner === m.player1 || m.winnerName === m.player1 ? '(W)' : ''}`;
                const p2Tags = `${m.breaker === m.player2 ? '(B)' : ''}${m.winner === m.player2 || m.winnerName === m.player2 ? '(W)' : ''}`;
                matchDetails += `${m.matchNum || (index+1)} (r${m.round || 1}): ${m.player1} ${p1Tags} vs ${m.player2} ${p2Tags}\n`;
            });

            return `🎱 Billiards Round-Robin Tournament

Players: ${players.join(' • ')}

Standings:
${winsText}
Matches Played: ${numMatches} (${fullRounds} full rounds)

Match Results:
${matchDetails}

Session Duration: ${totalMin}:${totalSec.toString().padStart(2, '0')}
Avg per Match: ${avgMin}:${avgS.toString().padStart(2, '0')}

Tracked with Billiards Score Tracker
Played on ${new Date(session.startTime || Date.now()).toLocaleDateString()}`;
        }

        function shareSessionData(session) {
            if (!session) return;
            const text = generateShareText(session);
            if (navigator.share) {
                navigator.share({
                    title: `Billiards Tournament - ${session.players ? session.players.join(' vs ') : ''}`,
                    text: text,
                }).catch(() => copyToClipboard(text));
            } else {
                copyToClipboard(text);
            }
        }

        function shareSessionById(id) {
            const session = sessionsHistory.find(s => s.id === id);
            if (session) shareSessionData(session);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("✅ Tournament summary copied to clipboard!");
                }).catch(() => {
                    alert("Summary:\n\n" + text);
                });
            } else {
                alert("Summary:\n\n" + text);
            }
        }

        function shareSession() {
            const session = summarySession || currentSession;
            if (session) shareSessionData(session);
        }

        function deleteSession(id) {
            if (!confirm("Delete this session permanently?")) return;
            
            sessionsHistory = sessionsHistory.filter(s => s.id !== id);
            try {
                localStorage.setItem('billiardsSessions', JSON.stringify(sessionsHistory));
            } catch (e) {
                console.warn('Failed to save sessions', e);
            }
            
            if (currentSession && currentSession.id === id) {
                teardownToWelcome();
            }
            if (summarySession && summarySession.id === id) {
                summarySession = null;
                $('summary-modal')?.classList.add('hidden');
            }
            
            showHistory();
        }

        function hideSummary() {
            const modal = $('summary-modal');
            if (!modal) return;
            modal.classList.add('hidden');

            const closed = modal.dataset.closed === 'true';
            const historyOnly = modal.dataset.historyOnly === 'true';
            const viewed = summarySession;
            summarySession = null;

            if (closed) {
                // Closing a completed summary:
                // - If we only viewed history while an unfinished session is active, keep it.
                // - If the active session itself was completed, tear down to welcome.
                if (historyOnly && currentSession && !currentSession.completed) {
                    showTab('session');
                    return;
                }
                if (currentSession && currentSession.completed) {
                    teardownToWelcome();
                    showTab('session');
                    return;
                }
                // Viewed a history item with no active unfinished session
                if (!currentSession || (viewed && currentSession.id === viewed.id && currentSession.completed)) {
                    teardownToWelcome();
                }
            }
            showTab('session');
        }

        function confirmCloseSession() {
            if (!currentSession || currentSession.completed) return;
            currentSession.endTime = Date.now();
            // Prefer accumulated match durations; fall back to wall-clock only if unset
            if (typeof currentSession.totalDuration !== 'number' || currentSession.totalDuration <= 0) {
                currentSession.totalDuration = Math.max(
                    0,
                    Math.floor((currentSession.endTime - (currentSession.startTime || currentSession.endTime)) / 1000)
                );
            }
            currentSession.completed = true;
            saveData();
            clearTimer();
            showSummary(currentSession); // Refresh summary with completed state
        }

        function saveCurrentSession() {
            if (!currentSession) return;
            saveData();
        }

        function showHistory() {
            populateHistory();
            showTab('history');
        }

        // Ensure old references are cleaned
        function resetSetupInputs() {
            initializePlayerSetup();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
