<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billiards Tracker">
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="ball" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed lighter green felt (fills Android adaptive icon safe area) -->
  <rect width="64" height="64" fill="url(#felt)"/>
  <!-- Soft inner ring for depth -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#6ee7b7" stroke-opacity="0.35" stroke-width="2"/>
  <!-- 8-ball — larger for app-icon readability -->
  <circle cx="32" cy="32" r="24" fill="url(#ball)"/>
  <circle cx="32" cy="29.5" r="10.5" fill="#fafafa"/>
  <text x="32" y="34.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#18181b">8</text>
  <circle cx="32" cy="32" r="24" fill="url(#shine)"/>
</svg>
